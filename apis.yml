name: Kardome Technology
description: Kardome develops Voice AI technology that lets voice-integrated products hear and understand
  speech with human-level accuracy in complex, real-world acoustic environments. Its two core technologies
  are Spatial Hearing AI, which understands the acoustic scene to localize sound sources and attribute
  speech to the correct speaker, and Cognition AI, which adds contextual awareness so devices understand
  what people mean in the moment. Kardome targets automotive in-car voice UI and smart-home voice interaction
  in noisy environments. The company is a Techstars portfolio company, tracked in the API Evangelist network;
  it licenses embedded voice technology to device makers rather than publishing a public developer API,
  SDK, or documentation surface at this time.
